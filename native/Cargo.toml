[workspace]
members = ["crates/office-core", "crates/office-ui", "crates/office-mail", "crates/office-conversie"]
default-members = ["crates/office-ui"]
exclude = ["vendor/openaec-ui", "vendor/docx-parse", "vendor/pptx", "vendor/xlsx-raster", "vendor/iced-tiny-skia"]
resolver = "3"

[workspace.package]
version = "2026.44.9-alpha.19"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
office-core = { path = "crates/office-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
thiserror = "2"
sha2 = "0.10.9"
base64 = "0.22.1"
tempfile = "3"
betteroffice-docx = { version = "=0.5.1", features = ["raster"] }
betteroffice-xlsx = { version = "=0.5.1", features = ["raster"] }
betteroffice-pptx = { version = "=0.5.1", features = ["raster"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8

[patch.crates-io]
betteroffice-docx-parse = { path = "vendor/docx-parse" }

betteroffice-pptx = { path = "vendor/pptx" }

betteroffice-xlsx-raster = { path = "vendor/xlsx-raster" }

iced_tiny_skia = { path = "vendor/iced-tiny-skia" }
