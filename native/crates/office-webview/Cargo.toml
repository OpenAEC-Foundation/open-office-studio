[package]
name = "open-office-studio-webview"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust-interface met de oorspronkelijke Office HTML en CSS"

[[bin]]
name = "open-office-studio-webview"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dioxus/desktop", "dep:rfd"]

[dependencies]
office-core.workspace = true
serde_json.workspace = true
base64.workspace = true
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "document"] }
rfd = { version = "0.15", optional = true }

[build-dependencies]
base64.workspace = true
serde_json.workspace = true

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
dioxus-ssr = "=0.7.10"
tempfile.workspace = true
