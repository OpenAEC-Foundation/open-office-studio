[package]
name = "office-writer-plakken"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Brongebonden voorbereiding van Writer-invoer en plakacties"

[features]
default = []
writer-bronjournaal = ["dep:yrs", "docx-edit/writer-bronjournaal"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
docx-edit = { package = "betteroffice-docx-edit", version = "=0.5.1" }

yrs = { version = "=0.27.4", optional = true }

[dev-dependencies]
yrs = "=0.27.4"

[[example]]
name = "writer-journaal-draad"
required-features = ["writer-bronjournaal"]
