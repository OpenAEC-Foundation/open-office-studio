name: P2 XLSB one-source content acceptance
on:
  push:
    branches: [codex/qa-xlsb-35-p2-d410-2026-11-23]
    paths:
      - qa/xlsb35-p2/**
      - .github/workflows/qa-xlsb35-p2-d410.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OOS_XLSB_APPLICATION_COMMIT: dc3f8d5d6e8fdffaaec82caa4ab93b579e075e6b
jobs:
  xlsb-one-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies, without an application build
        run: pnpm install --frozen-lockfile
      - name: Headless private-runtime libraries
        run: |
          sudo python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2 libcups2 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0 libice6 libnss3 libsm6 libx11-6 libxext6 libxinerama1 libxrandr2 libxrender1 libxslt1.1 libgl1 libglu1-mesa
      - name: Independently inspect the actual binary source
        run: python3 qa/xlsb35-p2/oracle.py --output .local/xlsb35-p2-proof/source-oracle.json
      - name: Verify the shared P2 runtime input and run the one-source caller
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 qa/xlsb35-p2/runtime_input.py qa/xlsb35-p2/runtime-input.json .local/xlsb35-p2-proof
      - name: Preserve source, runtime binding, converted and reopened content evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlsb35-p2-content-${{ github.run_id }}
          path: .local/xlsb35-p2-proof
          include-hidden-files: true
          if-no-files-found: warn
