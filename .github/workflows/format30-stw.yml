name: Format 30 genuine STW Linux QA
on:
  push:
    branches: [codex/formats-30-stw-qa-2026-11-23]
    paths: [.github/format30-stw-attempt.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: format30-stw-${{ github.ref }}
  cancel-in-progress: false
jobs:
  genuine-stw:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OOS_STW_HARNESS_COMMIT: ${{ github.sha }}
      OOS_STW_REUSE_PROOF: .local/stw-previous
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dc3f8d5d6e8fdffaaec82caa4ab93b579e075e6b
      - uses: actions/checkout@v4
        with:
          path: .local/stw-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Reuse hash-pinned completed conversion, no additional runtime download
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45146601537
          name: format30-stw-Linux
          path: .local/stw-previous
      - name: Check source oracle and actual production input/Writer-engine route
        run: node .local/stw-harness/scripts/proef-format30-stw.mjs .local/format30-stw-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: format30-stw-Linux
          path: .local/format30-stw-proof
          include-hidden-files: true
          if-no-files-found: warn
