name: Format 30 STW actual browser limit
on:
  push:
    branches: [codex/formats-30-stw-qa-2026-11-23]
    paths: [.github/format30-stw-browser-attempt.json]
permissions:
  contents: read
concurrency:
  group: format30-stw-browser
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      OOS_STW_HARNESS_COMMIT: ${{ github.sha }}
      OFFICE_TEST_SOURCE: dc3f8d5d6e8fdffaaec82caa4ab93b579e075e6b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dc3f8d5d6e8fdffaaec82caa4ab93b579e075e6b
      - uses: actions/checkout@v4
        with:
          path: .local/stw-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: |
            .local/lettertypen-cache
            .local/woordenboeken-cache
          key: runtime317-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('assets/kantoorruntime.json', 'assets/lettertypen.json', 'assets/woordenboeken.json') }}
          restore-keys: |
            runtime317-assets-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Linux Chromium test driver only
        run: |
          sudo python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          pnpm exec playwright install --with-deps chromium
      - name: Exact P2 frontend builds for both supported routes, no desktop build
        run: |
          node scripts/writer-proefbuild.mjs build .local/stw-P2-normal /
          node scripts/writer-proefbuild.mjs build .local/stw-P2-hosted /office/
      - name: Actual STW upload advice and unchanged existing DOCX on both routes
        run: node .local/stw-harness/scripts/format30-stw-browser.mjs .local/stw-P2 .local/stw-P2-browser-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: format30-stw-browser-Linux
          path: .local/stw-P2-browser-proof
          include-hidden-files: true
          if-no-files-found: warn
