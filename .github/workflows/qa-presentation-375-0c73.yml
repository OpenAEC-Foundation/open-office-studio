name: Presentation 375 private UNO diagnosis
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        description: Explicit diagnostic phase
        default: components
        options: [components, uno, uno-readonly, source-preflight, source-build]
      witness_start:
        type: string
        description: Preserve the original allocated witness start after a pre-source initialization failure
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  components:
    if: inputs.phase != 'source-preflight' && inputs.phase != 'source-build'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check private read-only namespace capability before consuming another runtime
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'uno-readonly'
        run: python scripts/qa-presentation-375/namespace_probe.py --capability-only
      - name: Verify private P2 runtime, producer and official parent package
        run: python scripts/qa-presentation-375/runtime_input.py
      - name: Inventory already present UNO components, without Office execution
        run: python scripts/qa-presentation-375/preflight.py
      - name: Fetch immutable existing UOP evidence only
        if: github.event_name == 'workflow_dispatch' && (inputs.phase == 'uno' || inputs.phase == 'uno-readonly')
        run: git fetch --no-tags --depth=1 origin e280e9521cfad3b2c61c26d19fbb5df8b5b74a42
      - name: Diagnose own isolated UNO document copies and clean up own process group
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'uno'
        run: python scripts/qa-presentation-375/probe.py
      - name: Run the single additional diagnostic inside an own read-only namespace
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'uno-readonly'
        run: python scripts/qa-presentation-375/namespace_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-375-uno-${{ inputs.phase || 'components' }}
          path: .local/presentation-375-runtime/
          include-hidden-files: true
          if-no-files-found: error
  source-build:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'source-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      OOS_375_WITNESS_START_EPOCH: ${{ inputs.witness_start }}
    steps:
      - run: echo "OOS_375_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck all resource gates on this actual VM before a large download
        run: python scripts/qa-presentation-375/build_preflight.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Frozen application/core-engine dependencies and immutable earlier oracles
        run: |
          git fetch --no-tags --depth=1 origin e280e9521cfad3b2c61c26d19fbb5df8b5b74a42 dc3f8d5d6e8fdffaaec82caa4ab93b579e075e6b
          pnpm install --frozen-lockfile --ignore-scripts
      - name: One bounded source witness, expected baseline red, full corrected draw tests and scoped engine oracle
        run: python scripts/qa-presentation-375/source_build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-375-source-witness
          path: |
            .local/presentation-375-source-build/
            .local/presentation-375-build-preflight/
          include-hidden-files: true
          if-no-files-found: error
  source-resources:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'source-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read existing compiler, memory and disk without source checkout or build
        run: python scripts/qa-presentation-375/build_preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-375-source-build-preflight
          path: .local/presentation-375-build-preflight/
          include-hidden-files: true
          if-no-files-found: error
