name: Presentation 375 private UNO component preflight
on:
  push:
    branches: [codex/presentation-375-uop-rectangle-fills-2026-11-23-0c73]
    paths: [.github/workflows/qa-presentation-375-0c73.yml]
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        description: Explicit diagnostic phase
        default: components
        options: [components]
permissions:
  contents: read
  actions: read
jobs:
  components:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private P2 runtime, producer and official parent package
        run: python scripts/qa-presentation-375/runtime_input.py
      - name: Inventory already present UNO components, without Office execution
        run: python scripts/qa-presentation-375/preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-375-uno-component-preflight
          path: .local/presentation-375-runtime/
          include-hidden-files: true
          if-no-files-found: error
