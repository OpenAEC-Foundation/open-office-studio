name: Native Mac361 bounded Tab save oracle - diagnostic only
on:
  push:
    branches: [codex/mac-native-body-blocker-20261120]
    paths: [.github/workflows/mac-native-361-tab-oracle.yml, .github/mac-native-361-tab-oracle-request.json]
permissions:
  contents: read
  actions: read
jobs:
  product-acceptance:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      OOS_361_EXECUTE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dc3f8d5d6e8fdffaaec82caa4ab93b579e075e6b
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/mac-body-harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the successful Mac job and full canonical artifact before package derivation
        run: python .local/mac-body-harness/scripts/mac-native-current-fetch.py .local/mac-body-harness/.github/mac-native-361-tab-oracle-request.json .local/mac361-tab-oracle-input
      - name: Exactly three Tabs then planned newrow and CommandS; independent DOCX XML
        run: python .local/mac-body-harness/scripts/mac-native-current-session.py .local/mac361-tab-oracle-input/identity.json .local/mac361-tab-oracle-native --acceptance --tab-save-oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac361-tab-oracle-native-${{ github.sha }}
          path: |
            .local/mac361-tab-oracle-native/
            .local/mac361-tab-oracle-input/identity.json
            .local/mac361-tab-oracle-input/request.json
            .local/mac361-tab-oracle-input/artifact-origin.json
          include-hidden-files: true
          if-no-files-found: error
