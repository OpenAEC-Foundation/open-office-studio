name: Documentmatrix op de productiekern controleren
on:
  pull_request:
    paths:
      - ".github/workflows/documentmatrix.yml"
      - "scripts/*matrix*"
      - "scripts/tekstkern-*"
      - "scripts/tekstengine-*"
      - "patches/tekstengine-*"
      - "vendor/tekstengine/**"
      - "src/pakketcontrole*"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: DOCX- en PPTX-rondgangen met de productiecorrecties
        env:
          OOS_MATRIX_ZONDER_CONVERSIE: "1"
        run: node scripts/test-matrix-documenten.mjs
      - name: Pakket-, tekst- en nootopmaakrapporten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentmatrix
          path: .local/matrix/documenten/*.json
          include-hidden-files: true
          if-no-files-found: error
