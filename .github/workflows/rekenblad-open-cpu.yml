name: Begrensd CPU-profiel van grote werkmap
on:
  push:
    branches: [codex/spreadsheet-large-workbooks-2026-11-10]
    paths:
      - .github/workflows/rekenblad-open-cpu.yml
      - scripts/profileer-rekenblad-wasm.mjs
permissions:
  contents: read
  actions: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: gh run download 42796095897 --name rekenbladkern-kandidaat --dir .local/open-kandidaat
      - run: python3 scripts/maak-rekenbladprestatie.py
      - name: Capture at most 20 seconds and stop the private worker
        run: timeout 40s node scripts/profileer-rekenblad-wasm.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rekenblad-open-cpu
          path: .local/openprofiel-cpu/
          include-hidden-files: true
