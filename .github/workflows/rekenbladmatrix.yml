name: Rekenbladmatrix onafhankelijk controleren
on:
  pull_request:
    paths:
      - ".github/workflows/rekenbladmatrix.yml"
      - "scripts/*rekenblad*"
      - "scripts/vergelijk_pakketten.py"
      - "patches/rekenbladengine-*"
      - "vendor/rekenbladengine/**"
      - "src/rekenbladcontrole*"
      - "src/rekenblad/**"
      - "src/afdrukken/**"
      - "src/export/pdf/**"
      - "src/grafieken/pakket*"
      - "src/grafieken/zipdelen*"
      - "src/grafieken/xml.ts"
      - "src/lint/rekenblad-filter*"
      - "packages/rekenbladen/**"
      - "src/export/index.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Productiekern en werkelijk opgeslagen formulewaarden
        run: node scripts/test-matrix-rekenbladen.mjs
      - name: Vastgezette tweede kern met dezelfde bronbestanden vergelijken
        run: node scripts/test-rekenblad-referentie.mjs
      - name: Vaste 100k x 30 en 50k-formulereferenties maken
        run: python scripts/maak-rekenbladprestatie.py
      - name: Tijd en geheugen van grote pakketmetadata begrenzen
        run: node --expose-gc scripts/meet-rekenbladpakket.mjs
      - name: Chromium for the real spreadsheet worker
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify 50,000 formulas without blocking the browser and cancelled opens
        run: node scripts/test-rekenbladadapter-worker.mjs
      - name: Read-only HYPERLINK targets with the current and pinned query-capable engines
        run: node scripts/test-rekenblad-koppeling-vragen.mjs
      - name: Print worksheet images and shapes through the production canvas and PDF path
        run: node scripts/test-rekenblad-objecten-print.mjs
      - name: Inspect searchable rotated text and embedded images with an independent PDF reader
        run: |
          python -m pip install pypdf==6.10.0 pypdfium2==5.14.0 Pillow==13.0.0
          python scripts/test-rekenblad-objecten-pdf.py
      - name: Verify drawing and hyperlink editing in the production browser build
        run: |
          pnpm exec vite build --outDir .local/dist --logLevel error
          node scripts/test-rekenblad-objecten-gui.mjs
      - name: Verify nested HYPERLINK expressions in the production UI with the pinned query engine
        env:
          OOS_TEST_REKENBLAD_WASM: .local/formula-query-compat/query-engine.wasm
          OFFICE_TEST_UIT: .local/proef-rekenblad-objecten-query-engine
        run: node scripts/test-rekenblad-objecten-gui.mjs
      - name: Formule-, pakket- en kenmerkrapporten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rekenbladmatrix
          path: |
            .local/matrix/rekenbladen/*.json
            .local/prestatie/rekenbladen/*.json
            .local/proef-rekenblad-objecten-print/*
            .local/proef-rekenblad-objecten/*
            .local/proef-rekenblad-objecten-query-engine/*
          include-hidden-files: true
          if-no-files-found: error
