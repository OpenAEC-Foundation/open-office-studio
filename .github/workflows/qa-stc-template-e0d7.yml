name: STC legacy template source oracle
on:
  push:
    branches: [codex/stc-template-qa-2026-11-23-e0d7]
    paths:
      - scripts/qa-stc-template/**
      - .github/workflows/qa-stc-template-e0d7.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify genuine legacy source and derive independent expectations
        run: python scripts/qa-stc-template/oracle.py source
      - uses: actions/upload-artifact@v4
        with:
          name: stc-source-oracle
          path: .local/stc-qa/
          include-hidden-files: true
          if-no-files-found: error
  browser_limit:
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch only the frozen application snapshot for the source guard
        run: git fetch --no-tags --depth=1 origin dc3f8d5d6e8fdffaaec82caa4ab93b579e075e6b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/download-artifact@v4
        with:
          name: stc-source-oracle
          path: .local/stc-qa
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check production template and no-desktop conversion guards
        run: node scripts/qa-stc-template/engine.mjs --route-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stc-browser-limit
          path: .local/stc-qa/route-report.json
          include-hidden-files: true
          if-no-files-found: error
