name: Native Rust controleren en bouwen
on:
  pull_request:
    paths: ["native/**", "public/templates/**", ".github/workflows/native-rust.yml"]
  push:
    branches: [main]
    paths: ["native/**", "public/templates/**", ".github/workflows/native-rust.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conversie-runtime:
    name: Conversie met geïnstalleerde kantoorruntime
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      OFFICE_TEST_UIT: ${{ github.workspace }}/native/target/conversie-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Kantoorruntime installeren
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            native/target
          key: conversie-runtime-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: conversie-runtime-${{ runner.os }}-
      - name: Ook de daadwerkelijke conversies uitvoeren
        run: cargo test --manifest-path native/Cargo.toml -p office-conversie --locked -- --include-ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-conversie-runtime
          path: native/target/conversie-runtime/
          if-no-files-found: warn
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      OFFICE_TEST_UITVOER: ${{ github.workspace }}/native/target/controle
      OFFICE_TEST_SCHERMEN: ${{ github.workspace }}/native/target/schermen
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux-vensterafhankelijkheden
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: native-${{ runner.os }}-
      - run: python native/scripts/controleer-bron.py
      - run: python native/scripts/controleer-migratie.py
      - run: cargo fmt --manifest-path native/Cargo.toml -p office-core -p open-office-studio-native -p office-mail -p office-conversie --check
      - run: cargo clippy --manifest-path native/Cargo.toml --workspace --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - name: Native uitvoer onafhankelijk teruglezen
        run: |
          python -m pip install python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2
          python native/crates/office-core/tests/fixtures/controleer.py "${{ env.OFFICE_TEST_UITVOER }}"
          python -m unittest discover -s native/scripts -p 'test_*.py'
      - run: cargo build --manifest-path native/Cargo.toml --workspace --locked --release
      - name: Gecompileerde afhankelijkheden bewaren vóór het verpakken
        uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - id: verpakken
        run: python native/scripts/verpak.py
      - run: python native/scripts/controleer-pakket.py "${{ steps.verpakken.outputs.pakket }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-rust-${{ runner.os }}
          path: |
            ${{ steps.verpakken.outputs.pakket }}
            ${{ steps.verpakken.outputs.controlehash }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-controle-${{ runner.os }}
          path: |
            native/target/schermen/*.png
            native/target/controle/*
          if-no-files-found: warn
