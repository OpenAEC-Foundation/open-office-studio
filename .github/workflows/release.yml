name: DERIVED P5 Mac save research (manual, gated, no publishing)
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [disabled, build, native]
        default: disabled
        description: Integration operator only; requires separate explicit user consent
      approval_json:
        type: string
        default: '{}'
        description: Frozen stage-specific live approval; disabled template is rejected
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-p5-mac-save-research
  cancel-in-progress: false
env:
  PRODUCER_ROOT: ${{ github.workspace }}/producer
  CODE: ${{ github.workspace }}/producer/qa/mac-save-trace-execution/2026-11-24
jobs:
  gate:
    if: inputs.stage != 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      appCommit: ${{ steps.gate.outputs.appCommit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: producer
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Gate before any Mac allocation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
        run: python3 "$CODE/gate.py" "$STAGE"
  build:
    name: Build derived research Suite
    needs: gate
    if: inputs.stage == 'build'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: producer
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate live build request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$CODE/gate.py" build
          python3 -c 'import os,time; print("OOS_WORK_UNTIL="+str(time.time()+75*60))' >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: application
          ref: ${{ needs.gate.outputs.appCommit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen source
        run: python3 "$CODE/verify_source.py" "$GITHUB_WORKSPACE/application"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.25.0
          package_json_file: application/package.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Locked dependencies
        working-directory: application
        run: pnpm install --frozen-lockfile
      - name: Compile default and observer
        run: python3 "$CODE/build.py" "$RUNNER_TEMP/mac-save-execution-approval.json" "$GITHUB_WORKSPACE/application" "$RUNNER_TEMP/mac-save-build-proof"
      - name: Build signed research Suite
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 "$CODE/build.py" package "$RUNNER_TEMP/mac-save-execution-approval.json" "$GITHUB_WORKSPACE/application" "$RUNNER_TEMP/mac-save-build-proof"
      - name: Verify derived package
        run: python3 "$CODE/build.py" verify "$RUNNER_TEMP/mac-save-execution-approval.json" "$GITHUB_WORKSPACE/application" "$RUNNER_TEMP/mac-save-build-proof"
      - name: Cleanup own build resources
        if: always()
        timeout-minutes: 3
        run: python3 "$CODE/teardown.py" build "$RUNNER_TEMP/mac-save-execution-approval.json" "$RUNNER_TEMP/mac-save-build-proof"
      - name: Upload DERIVED research package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: derived-mac-save-trace-package
          path: ${{ runner.temp }}/mac-save-build-proof/package/*
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-save-derived-build-evidence
          path: |
            ${{ runner.temp }}/mac-save-build-proof/**
            !${{ runner.temp }}/mac-save-build-proof/package/**
          retention-days: 14
          if-no-files-found: warn
  native:
    name: Observe one native derived Q and save
    needs: gate
    if: inputs.stage == 'native'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: producer
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate live native request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$CODE/gate.py" native
          python3 -c 'import os,time; print("OOS_WORK_UNTIL="+str(time.time()+12*60))' >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: application
          ref: ${{ needs.gate.outputs.appCommit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen source
        run: python3 "$CODE/verify_source.py" "$GITHUB_WORKSPACE/application"
      - name: One native observation
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$CODE/native.py" "$RUNNER_TEMP/mac-save-execution-approval.json" "$GITHUB_WORKSPACE/application" "$RUNNER_TEMP/mac-save-native-proof"
      - name: Cleanup own native resources
        if: always()
        timeout-minutes: 3
        run: python3 "$CODE/teardown.py" native "$RUNNER_TEMP/mac-save-execution-approval.json" "$RUNNER_TEMP/mac-save-native-proof"
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-save-derived-native-evidence
          path: ${{ runner.temp }}/mac-save-native-proof/**
          retention-days: 14
          if-no-files-found: warn
