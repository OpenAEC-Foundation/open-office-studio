name: Uitgave bouwen, ondertekenen en publiceren
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publiceren:
        description: Maak na alle controles een concept-uitgave van deze bronrevisie
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: uitgave-${{ github.ref }}
  cancel-in-progress: false
jobs:
  versie:
    runs-on: ubuntu-latest
    outputs:
      versie: ${{ steps.versie.outputs.versie }}
    steps:
      - uses: actions/checkout@v4
      # Versies volgen JJJJ.WW.N, net als de andere OpenAEC-studio's. De tag,
      # package.json, tauri.conf.json en Cargo.toml moeten gelijk zijn;
      # Cargo.lock wordt via --locked in de bouwjob bewaakt. De weekversie
      # (versie.json) en Database Studio volgen dezelfde versie; zet ze met
      # `pnpm versie:week <datum> <volgnummer>`.
      - name: Versie en tag vergelijken
        id: versie
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          versie=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if ! [[ "$versie" =~ ^20[0-9]{2}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "::error::Versie $versie volgt niet JJJJ.WW.N."; exit 1
          fi
          if [ "$versie" != "$tauri" ] || [ "$versie" != "$cargo" ]; then
            echo "::error::Versies lopen uiteen: package.json $versie, tauri.conf.json $tauri, Cargo.toml $cargo."; exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$versie" ]; then
            echo "::error::Tag $REF_NAME hoort v$versie te zijn."; exit 1
          fi
          node scripts/controleer-weekversie.mjs
          echo "versie=$versie" >> "$GITHUB_OUTPUT"

  bouwen:
    needs: versie
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bundels: nsis
          - os: macos-latest
            label: macOS
            bundels: dmg
          - os: ubuntu-22.04
            label: Linux
            bundels: deb,appimage
    name: Bouwen – ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Ondertekening komt uit de organisatiesecrets. Bij een tag is zij verplicht;
    # een handmatige proefrun bouwt zonder secrets onondertekend.
    env:
      WIN_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_ENDPOINT != '' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' }}
      MAC_SIGN: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_KEY != '' }}
      ONDERTEKENEN_VERPLICHT: ${{ github.ref_type == 'tag' || inputs.publiceren == true }}
      # Updaters (#26, docs/updates.md): alleen met het organisatiegeheim én een publieke sleutel
      # in tauri.conf.json. Ontbreekt een van beide, dan wordt gewoon zonder updater-artefacten
      # gebouwd en staat de updatefunctie in die versie uit.
      UPDATER_GEHEIM: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Ondertekening beschikbaar
        shell: bash
        run: |
          ontbreekt=""
          if [ "$RUNNER_OS" = Windows ] && [ "$WIN_SIGN" != true ]; then ontbreekt="Azure Artifact Signing (AZURE_*)"; fi
          if [ "$RUNNER_OS" = macOS ] && [ "$MAC_SIGN" != true ]; then ontbreekt="Apple Developer ID (APPLE_*)"; fi
          if [ -n "$ontbreekt" ]; then
            if [ "$ONDERTEKENEN_VERPLICHT" = true ]; then
              echo "::error::Secrets voor $ontbreekt ontbreken; geef deze repository toegang tot de organisatiesecrets."; exit 1
            fi
            echo "::warning::Secrets voor $ontbreekt ontbreken; deze proefrun bouwt onondertekend."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          # De spellingmodule (src/spelling/rust) wordt naar WebAssembly gebouwd.
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Updater-artefacten (alleen met geheim en publieke sleutel)
        shell: bash
        run: |
          sleutel=$(node -p "((require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey) ?? '').trim().length > 0")
          if [ "$UPDATER_GEHEIM" = true ] && [ "$sleutel" = true ]; then
            printf '%s' '{"bundle":{"createUpdaterArtifacts":true}}' > "$RUNNER_TEMP/updater.conf.json"
            echo "UPDATER_CONFIG=$RUNNER_TEMP/updater.conf.json" >> "$GITHUB_ENV"
            echo "Updater-artefacten: aan (ondertekend met TAURI_SIGNING_PRIVATE_KEY)."
          elif [ "$UPDATER_GEHEIM" = true ]; then
            echo "::warning::Het geheim TAURI_SIGNING_PRIVATE_KEY bestaat, maar plugins.updater.pubkey in src-tauri/tauri.conf.json is leeg; bouwen zonder updater-artefacten (docs/updates.md)."
          elif [ "$sleutel" = true ]; then
            echo "::warning::De publieke updatersleutel staat in tauri.conf.json, maar het geheim TAURI_SIGNING_PRIVATE_KEY ontbreekt; bouwen zonder updater-artefacten (docs/updates.md)."
          else
            echo "Updater niet ingericht; bouwen zonder updater-artefacten (docs/updates.md)."
          fi
      - name: Linux-bouwafhankelijkheden
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools poppler-utils python3-xlib python3-pil python3-gi python3-venv xvfb xauth xdotool
      - name: Python-omgeving voor native GUI-proeven
        if: runner.os == 'Linux'
        run: |
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/office-native-gui"
          "$RUNNER_TEMP/office-native-gui/bin/python" -m pip install --ignore-installed -r scripts/gui/requirements.txt
          echo "OFFICE_GUI_PYTHON=$RUNNER_TEMP/office-native-gui/bin/python" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Browser voor de suitecontrole klaarzetten
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      # Extra open lettertypen (assets/lettertypen.json): bewaard per manifestversie,
      # zodat een build zonder netwerk naar GitHub ook werkt.
      - name: Lettertypencache
        uses: actions/cache@v4
        with:
          path: .local/lettertypen-cache
          key: lettertypen-${{ hashFiles('assets/lettertypen.json') }}
      - run: node scripts/haal-lettertypen.mjs
      # Woordenboeken voor de spellingcontrole (assets/woordenboeken.json).
      - name: Woordenboekencache
        uses: actions/cache@v4
        with:
          path: .local/woordenboeken-cache
          key: woordenboeken-${{ hashFiles('assets/woordenboeken.json') }}
      - run: node scripts/haal-woordenboeken.mjs
      - run: pnpm versie:check
      - name: Vastgelegde versleutelde proefbestanden ophalen
        run: node scripts/corpus-download.mjs docs/tests/versleuteling-manifest.json
      - run: pnpm test
      - run: python -m unittest discover -s tests -v
      - run: node scripts/test-kantoor-engines.mjs
      - run: pnpm test:opdrachten
      - name: Windows-loader voorbereiden
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/voorbereiden-windows.ps1
          ./scripts/voorbereiden-windows.ps1 -ProjectMap apps/database-studio/src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path apps/database-studio/src-tauri/Cargo.toml --locked

      # De dlib van de signeerclient heeft .NET 8 nodig.
      - name: .NET 8 voor de signeerclient
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Authenticode voorbereiden
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        shell: pwsh
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: pwsh -NoProfile -File scripts/windows-sign.ps1 -Setup
      # Notarisatie via een App Store Connect API-sleutel.
      - name: App Store Connect-sleutel klaarzetten
        if: runner.os == 'macOS' && env.MAC_SIGN == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"

      - name: Pakket bouwen (onondertekend)
        if: >-
          !(runner.os == 'Windows' && env.WIN_SIGN == 'true') &&
          !(runner.os == 'macOS' && env.MAC_SIGN == 'true')
        shell: bash
        env:
          UPDATER_SLEUTEL: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_WACHTWOORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # De updatersleutel alleen voor Office Studio (Database Studio heeft geen updater).
          if [ -n "${UPDATER_CONFIG:-}" ]; then
            TAURI_SIGNING_PRIVATE_KEY="$UPDATER_SLEUTEL" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_WACHTWOORD" \
              pnpm desktop:build --bundles ${{ matrix.bundels }} --config "$UPDATER_CONFIG"
          else
            pnpm desktop:build --bundles ${{ matrix.bundels }}
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            "$OFFICE_GUI_PYTHON" scripts/test-writer-kleur-native.py --programma src-tauri/target/release/open-office-studio --versie "$(node -p "require('./package.json').version")" --uitvoer .local/proef-native-writer-kleur
            "$OFFICE_GUI_PYTHON" scripts/test-writer-klembord-native.py --programma src-tauri/target/release/open-office-studio --versie "$(node -p "require('./package.json').version")" --uitvoer .local/proef-native-writer-klembord
            "$OFFICE_GUI_PYTHON" scripts/test-writer-lijsten-native.py --programma src-tauri/target/release/open-office-studio --versie "$(node -p "require('./package.json').version")" --uitvoer .local/proef-native-writer-lijsten
            "$OFFICE_GUI_PYTHON" scripts/test-writer-rendererfout-native.py --programma src-tauri/target/release/open-office-studio --versie "$(node -p "require('./package.json').version")" --uitvoer .local/proef-native-writer-renderer
            "$OFFICE_GUI_PYTHON" scripts/test-writer-lang-native.py --programma src-tauri/target/release/open-office-studio --versie "$(node -p "require('./package.json').version")" --uitvoer .local/proef-native-writer-lang --verwacht-rust-tekst --verwacht-worker-layout --framebasis
            "$OFFICE_GUI_PYTHON" scripts/test-writer-rijk-plakken-native.py --programma src-tauri/target/release/open-office-studio --versie "$(node -p "require('./package.json').version")" --rondes 3 --bewaar-na-ronde 1 --maxduur 180 --vereis-rust-plakken --uitvoer .local/proef-native-writer-bewaren
            "$OFFICE_GUI_PYTHON" scripts/test-writer-rust-plakken-volgorde-native.py --programma src-tauri/target/release/open-office-studio --versie "$(node -p "require('./package.json').version")" --uitvoer .local/proef-native-writer-volgorde
            "$OFFICE_GUI_PYTHON" scripts/test-writer-rust-tekst-native.py --programma src-tauri/target/release/open-office-studio --versie "$(node -p "require('./package.json').version")" --uitvoer .local/proef-native-writer-tekst
            node scripts/test-writer-revisies-gui.mjs
          fi
          node scripts/verzamel-studio.mjs office
          pnpm database:desktop:build --bundles ${{ matrix.bundels }}
          node scripts/verzamel-studio.mjs database
          for studio in writer spreadsheet presentation email notition; do
            node scripts/bouw-studio.mjs "$studio" --bundles ${{ matrix.bundels }}
          done
      # Tauri roept signCommand aan voor het programma, de uninstaller en de installer.
      - name: Pakket bouwen (Windows, ondertekend)
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          UPDATER_SLEUTEL: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_WACHTWOORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $updater = @()
          if ($env:UPDATER_CONFIG) {
            $updater = @('--config', $env:UPDATER_CONFIG)
            $env:TAURI_SIGNING_PRIVATE_KEY = $env:UPDATER_SLEUTEL
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:UPDATER_WACHTWOORD
          }
          pnpm desktop:build --bundles ${{ matrix.bundels }} --config "$env:OPS_SIGN_CONFIG" @updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verzamel-studio.mjs office
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY, Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          pnpm database:desktop:build --bundles ${{ matrix.bundels }} --config "$env:OPS_SIGN_CONFIG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verzamel-studio.mjs database
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($studio in @('writer', 'spreadsheet', 'presentation', 'email', 'notition')) {
            node scripts/bouw-studio.mjs $studio --bundles ${{ matrix.bundels }} --config "$env:OPS_SIGN_CONFIG"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Pakket bouwen (macOS, ondertekend en genotariseerd)
        if: runner.os == 'macOS' && env.MAC_SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATER_SLEUTEL: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_WACHTWOORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${UPDATER_CONFIG:-}" ]; then
            TAURI_SIGNING_PRIVATE_KEY="$UPDATER_SLEUTEL" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_WACHTWOORD" \
              pnpm desktop:build --bundles ${{ matrix.bundels }} --config "$UPDATER_CONFIG"
          else
            pnpm desktop:build --bundles ${{ matrix.bundels }}
          fi
          node scripts/verzamel-studio.mjs office
          pnpm database:desktop:build --bundles ${{ matrix.bundels }}
          node scripts/verzamel-studio.mjs database
          for studio in writer spreadsheet presentation email notition; do
            node scripts/bouw-studio.mjs "$studio" --bundles ${{ matrix.bundels }}
          done

      - name: Invoer en bestandsbehoud via de productie-GUI
        if: runner.os == 'Linux'
        run: |
          node scripts/test-rekenblad-gui.mjs
          node scripts/test-writer-lettergrootte-gui.mjs
          node scripts/test-writer-kleur-gui.mjs
          node scripts/test-writer-spiegel-gui.mjs
          node scripts/test-writer-spelling-gui.mjs
      - name: GUI-bewijs bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: uitgave-rekenblad-gui-${{ matrix.label }}
          path: .local/proef-rekenblad-gui/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Native Writer-klembordbewijs bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-writer-klembord-${{ github.workflow }}-${{ matrix.os || matrix.label }}
          path: .local/proef-native-writer-klembord/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Writer-revisiebewijs bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: writer-revisies-${{ github.workflow }}-${{ matrix.os || matrix.label }}
          path: .local/proef-writer-revisies/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Native Writer-langdocumentbewijs bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-writer-lang-${{ github.workflow }}-${{ matrix.os || matrix.label }}
          path: .local/proef-native-writer-lang/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Native Writer-volgordebewijs bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-writer-volgorde-${{ github.workflow }}-${{ matrix.label }}
          path: |
            .local/proef-native-writer-volgorde/
            .local/proef-native-writer-tekst/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Exacte afgekeurde Writer-binary en runtime bewaren
        if: failure() && runner.os == 'Linux'
        run: >-
          python3 scripts/bewaar-writer-foutcontext.py
          --programma src-tauri/target/release/open-office-studio
          --rapport .local/proef-native-writer-kleur/rapport.json
          --rapport .local/proef-native-writer-klembord/rapport.json
          --rapport .local/proef-native-writer-lijsten/rapport.json
          --rapport .local/proef-native-writer-renderer/rapport.json
          --rapport .local/proef-native-writer-lang/rapport.json
          --rapport .local/proef-native-writer-bewaren/rapport.json
          --rapport .local/proef-native-writer-volgorde/rapport.json
          --rapport .local/proef-native-writer-tekst/rapport.json
          --uitvoer .local/writer-foutcontext
          --appimage-map src-tauri/target/release/bundle/appimage
      - name: Writer-foutcontext uploaden
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: writer-foutcontext-${{ github.workflow }}-${{ matrix.label }}
          path: |
            .local/writer-foutcontext/*.tar.gz
            .local/writer-foutcontext/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Native Writer-rendererbewijs bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-writer-renderer-${{ github.workflow }}-${{ matrix.label }}
          path: .local/proef-native-writer-renderer/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Native Writer-lijstbewijs bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-writer-lijsten-${{ github.workflow }}-${{ matrix.label }}
          path: .local/proef-native-writer-lijsten/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Writer-bewaarbewijs bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-writer-bewaren-${{ github.workflow }}-${{ matrix.label }}
          path: .local/proef-native-writer-bewaren/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Native Writer-kleurbewijs bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-writer-kleur-${{ github.workflow }}-${{ matrix.os || matrix.label }}
          path: .local/proef-native-writer-kleur/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Lange-documentspelling bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: writer-spelling-${{ github.workflow }}-${{ matrix.os || matrix.label }}
          path: .local/proef-writer-spelling/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Tekstspiegel en tabelvoorbeeld bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: writer-spiegel-${{ github.workflow }}-${{ matrix.os || matrix.label }}
          path: .local/proef-writer-spiegel/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Writer-kleurbewijs bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: writer-kleur-${{ github.workflow }}-${{ matrix.os || matrix.label }}
          path: .local/proef-writer-kleur/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Writer-lettergroottebewijs bewaren
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: uitgave-writer-lettergrootte-gui-${{ matrix.label }}
          path: .local/proef-writer-lettergrootte/
          include-hidden-files: true
          if-no-files-found: warn

      # Poort: installer, geïnstalleerd programma en uninstaller dragen een geldige
      # handtekening met tijdstempel. Het programma wordt gecontroleerd zoals het in
      # de installer zit; target/release bevat na het bundelen een ongetekende kopie.
      - name: Authenticode controleren (installer, programma en uninstaller)
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Controleer($label, $pad) {
            if (-not (Test-Path $pad)) { throw "${label}: bestand ontbreekt ($pad)" }
            $sig = Get-AuthenticodeSignature -FilePath $pad
            Write-Host "${label}: $($sig.Status); $($sig.SignerCertificate.Subject); tijdstempel: $($sig.TimeStamperCertificate.Subject)"
            if ($sig.Status -ne 'Valid' -or $null -eq $sig.TimeStamperCertificate) { throw "${label}: geen geldige Authenticode-handtekening met tijdstempel" }
            & $env:OPS_SIGNTOOL verify /pa /v $pad
            if ($LASTEXITCODE -ne 0) { throw "signtool verify faalde voor $label" }
          }
          # Office Studio en de zelfstandige Database Studio, elk met eigen installer.
          function ControleerApp($bundel, $naam, $programma) {
            $setup = Get-ChildItem "$env:GITHUB_WORKSPACE/$bundel/nsis/$($naam)_*-setup.exe" | Select-Object -First 1
            if ($null -eq $setup) { throw "Geen *-setup.exe gebouwd voor $naam." }
            Controleer "installer $naam" $setup.FullName
            $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Stil installeren van $naam faalde ($($p.ExitCode))." }
            $sleutels = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                          'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*')
            $item = Get-ItemProperty $sleutels -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "$naam*" } | Select-Object -First 1
            if ($null -eq $item) { throw "Geen Uninstall-sleutel na installeren van $naam." }
            if ($item.Publisher -ne 'OpenAEC Foundation') { throw "Onverwachte uitgever van ${naam}: $($item.Publisher)" }
            $uninstaller = $item.UninstallString.Trim('"')
            $map = Split-Path $uninstaller
            Controleer "$programma.exe (geïnstalleerd)" (Join-Path $map "$programma.exe")
            if (-not (Test-Path (Join-Path $map 'WebView2Loader.dll'))) { throw "WebView2Loader.dll ontbreekt in de installatie van $naam." }
            Controleer "uninstaller $naam" $uninstaller
            $u = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($u.ExitCode -ne 0) { Write-Host "::warning::Stil verwijderen van $naam gaf $($u.ExitCode)." }
          }
          ControleerApp 'dist-installers/office' 'Open Office Studio' 'open-office-studio'
          ControleerApp 'dist-installers/database' 'Open Database Studio' 'open-database-studio'
          $studios = Get-Content assets/studios.json -Raw | ConvertFrom-Json
          foreach ($studio in $studios | Where-Object { $_.sleutel -notin @('office', 'database') }) {
            ControleerApp "dist-installers/$($studio.sleutel)" $studio.naam $studio.programma
          }
      # De .app uit de DMG: handtekening, Gatekeeper en het geniete notarisatieticket.
      - name: Handtekening en notarisatie controleren (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGN == 'true'
        run: |
          set -euo pipefail
          for bundel in dist-installers/*; do
            dmg="$(find "$bundel/dmg" -name '*.dmg' -print -quit)"
            test -n "$dmg"
            koppel="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$koppel" "$dmg"
            app="$(find "$koppel" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$app"
            mkdir -p "$RUNNER_TEMP/controle"
            cp -R "$app" "$RUNNER_TEMP/controle/"
            hdiutil detach "$koppel"
            app="$RUNNER_TEMP/controle/$(basename "$app")"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done
      - name: Linux-installers werkelijk uitpakken en controleren
        if: runner.os == 'Linux'
        run: |
          python scripts/controleer-installers.py --platform linux --bundels dist-installers/office --rapport .local/pakketcontrole-Linux.json
          python scripts/controleer-installers.py --platform linux --programma open-database-studio --bundels dist-installers/database --rapport .local/pakketcontrole-Database-Linux.json
          for studio in writer spreadsheet presentation email notition; do
            python scripts/controleer-installers.py --platform linux --programma "open-$studio-studio" --bundels "dist-installers/$studio" --rapport ".local/pakketcontrole-$studio-Linux.json"
          done
      - name: Windows-installer werkelijk uitpakken en controleren
        if: runner.os == 'Windows'
        run: |
          python scripts/controleer-installers.py --platform windows --bundels dist-installers/office --rapport .local/pakketcontrole-Windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/controleer-installers.py --platform windows --programma open-database-studio --bundels dist-installers/database --rapport .local/pakketcontrole-Database-Windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $studios = Get-Content assets/studios.json -Raw | ConvertFrom-Json
          foreach ($studio in $studios | Where-Object { $_.sleutel -notin @('office', 'database') }) {
            python scripts/controleer-installers.py --platform windows --programma $studio.programma --bundels "dist-installers/$($studio.sleutel)" --rapport ".local/pakketcontrole-$($studio.sleutel)-Windows.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: uitgave-${{ matrix.label }}
          path: |
            dist-installers/**/*.deb
            dist-installers/**/*.AppImage
            dist-installers/**/*-setup.exe
            dist-installers/**/*.dmg
            dist-installers/**/*.sig
            dist-installers/**/macos/*.app.tar.gz
            .local/pakketcontrole-*.json
          include-hidden-files: true
          if-no-files-found: error

  # Concept-uitgave: de ondertekende installer wordt eerst nog geïnstalleerd en
  # bediend voordat de uitgave openbaar wordt.
  publiceren:
    needs: [versie, bouwen]
    if: github.ref_type == 'tag' || inputs.publiceren == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Alleen het script voor het updatemanifest.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            assets
      - uses: actions/download-artifact@v4
        with:
          path: artefacten
      - name: Bestanden, updatemanifest en SHA256SUMS verzamelen
        env:
          TAG: v${{ needs.versie.outputs.versie }}
          VERSIE: ${{ needs.versie.outputs.versie }}
        run: |
          mkdir uitgave
          find artefacten -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' -o -name 'pakketcontrole-*.json' \) -exec cp {} uitgave/ \;
          cd uitgave
          # GitHub vervangt spaties in namen van uitgavebestanden door punten;
          # zelf hernoemen houdt SHA256SUMS gelijk aan de downloadnamen.
          for bestand in *' '*; do [ -e "$bestand" ] && mv -- "$bestand" "${bestand// /.}"; done
          node ../scripts/controleer-uitgave.mjs . "$VERSIE"
          # latest.json voor de updater (#26); zonder handtekeningen (geen geheim) wordt het overgeslagen.
          node ../scripts/maak-latest-json.mjs . "$VERSIE" "$TAG" "Open Office Studio $VERSIE: zie de uitgavenpagina voor de wijzigingen."
      - name: Linux-pakketten en checksums ondertekenen en verifiëren
        env:
          OPENAEC_GPG_PRIVATE_KEY: ${{ secrets.OPENAEC_GPG_PRIVATE_KEY }}
          OPENAEC_GPG_PASSPHRASE: ${{ secrets.OPENAEC_GPG_PASSPHRASE }}
          GNUPGHOME: ${{ runner.temp }}/openaec-uitgave-gnupg
        run: |
          set -euo pipefail
          test -n "$OPENAEC_GPG_PRIVATE_KEY" || { echo '::error::OpenAEC-OpenPGP-sleutel ontbreekt.'; exit 1; }
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$OPENAEC_GPG_PRIVATE_KEY" | gpg --batch --import
          sleutel=13F6D414ADEE4ED4CD09AC60601D86C93C504D29
          gpg --batch --list-secret-keys "$sleutel" >/dev/null
          cd uitgave
          for bestand in *.deb *.AppImage; do
            printf '%s' "$OPENAEC_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "$sleutel" --armor --detach-sign "$bestand"
            gpg --batch --verify "$bestand.asc" "$bestand"
          done
          gpg --armor --export "$sleutel" > openaec-signing-public-key.asc
          printf '%s\n' "$sleutel" > openaec-signing-fingerprint.txt
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          printf '%s' "$OPENAEC_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "$sleutel" --armor --detach-sign SHA256SUMS
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Concept-uitgave aanmaken
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.versie.outputs.versie }}
          VERSIE: ${{ needs.versie.outputs.versie }}
        run: |
          gh release create "$TAG" uitgave/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Open Office Studio $VERSIE" \
            --notes "Ontwikkelversie $VERSIE: Open Office Studio, Open Writer Studio, Open Spreadsheet Studio, Open Presentation Studio, Open Email Studio, Open Notition Studio en Open Database Studio. Iedere app heeft een eigen installer en profiel. Windows x64 (ondertekend), macOS Apple Silicon (ondertekend en genotariseerd), Linux x64 (DEB en AppImage). Pakketrapporten en SHA256SUMS zijn bijgevoegd. Dit zijn ontwikkelversies; zie de controleverslagen voor beperkingen en nog niet geteste functies."
