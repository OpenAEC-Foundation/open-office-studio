name: P5 single Linux parent preparation
on:
  push:
    branches: [codex/linux-release-input-p5-2026-11-23]
    paths: [docs/tests/linux-release-input-p5/request.json]
permissions:
  contents: read
  actions: read
env:
  STANDALONE_APP_COMMIT: b696ab86bd1c128729a079b68c0082e6df3d36a5
  STANDALONE_BUILD_RUN: "45177730188"
  STANDALONE_LINUX_JOB: "137703365848"
  STANDALONE_PURPOSE: P5-frozen-candidate
jobs:
  prepare:
    name: One canonical Linux ZIP; separate app and Suite inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STANDALONE_APP_COMMIT }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/p5-harness
      - name: Install package-inspection tool only
        run: |
          sudo python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
      - name: Verify exact source and official Linux job gates, download parent once, split original bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .local/p5-harness/scripts/test-linux-release-input-p5.py
          python3 .local/p5-harness/scripts/prepare-linux-release-input-p5.py
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-writer-p5
          path: .local/standalone-linux-prepared/writer/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-spreadsheet-p5
          path: .local/standalone-linux-prepared/spreadsheet/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-presentation-p5
          path: .local/standalone-linux-prepared/presentation/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-email-p5
          path: .local/standalone-linux-prepared/email/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-notition-p5
          path: .local/standalone-linux-prepared/notition/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-database-p5
          path: .local/standalone-linux-prepared/database/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: suite-input-office-deb-p5
          path: .local/suite-input-office-deb-p5/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: suite-input-office-appimage-p5
          path: .local/suite-input-office-appimage-p5/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Bind official transfer artifact digests into small descriptors
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .local/p5-harness/scripts/finalize-linux-release-input-p5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-release-input-p5-metadata
          path: |
            .local/linux-release-input-p5-metadata/
            .local/standalone-linux-prepared/preparation-receipt.json
            .local/standalone-linux-prepared/*/origin.json
            .local/standalone-linux-prepared/*/pakketcontrole-*.json
          include-hidden-files: true
          if-no-files-found: warn
