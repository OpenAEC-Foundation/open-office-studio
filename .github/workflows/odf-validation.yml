name: Validate strict ODF 1.3 output
on:
  pull_request:
    paths:
      - ".github/workflows/odf-validation.yml"
      - "scripts/test-odf-13.py"
      - "scripts/test-rekenbladformaten.py"
      - "scripts/test-rekenbladformaten-engine.mjs"
      - "src/import/rekenbladformaten.test.ts"
      - "src/import/bronmacros*"
      - "src-tauri/src/conversieprofiel.xcu"
      - "src-tauri/src/conversie.rs"
      - "src/formaten.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  odf:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Install converter and validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress
          python -m pip install lxml==6.1.1 openpyxl==3.1.5
      - name: Validate ODT, ODS and ODP output against OASIS 1.3 schemas
        run: python scripts/test-odf-13.py
      - name: Spreadsheet formats, 1900/1904 dates and independent formula results
        run: python scripts/test-rekenbladformaten.py
      - name: Edit and save converter outputs through the production spreadsheet engine
        run: |
          node scripts/test-rekenbladformaten-engine.mjs
          python scripts/test-rekenbladformaten.py --validate-engine
          python scripts/test-rekenbladformaten.py --roundtrip-engine
      - name: Preserve schemas, isolated profiles, outputs and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odf-13-validation
          path: |
            .local/odf-13
            .local/rekenbladformaten
          include-hidden-files: true
          if-no-files-found: error
