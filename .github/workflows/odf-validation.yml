name: Validate strict ODF 1.3 output
on:
  pull_request:
    paths:
      - ".github/workflows/odf-validation.yml"
      - "scripts/test-odf-13.py"
      - "src-tauri/src/conversieprofiel.xcu"
      - "src-tauri/src/conversie.rs"
      - "src/formaten.json"
      - "docs/tests/documentmatrix-2026-11-06/bron/*.docx"
      - "public/templates/nieuw.xlsx"
      - "public/templates/nieuw.pptx"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  odf:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install converter and validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress
          python -m pip install lxml==6.1.1
      - name: Validate ODT, ODS and ODP output against OASIS 1.3 schemas
        run: python scripts/test-odf-13.py
      - name: Preserve schemas, isolated profiles, outputs and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odf-13-validation
          path: .local/odf-13
          include-hidden-files: true
          if-no-files-found: error
