name: Frozen release 2026.48.1 browser acceptance
on:
  push:
    branches: [codex/release-481-browser-2026-11-23]
    paths: [".github/office-writer-I3-qa.json"]
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON array of runner labels; rerun only missing platforms
        required: false
        default: '["ubuntu-22.04","windows-latest","macos-latest"]'
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms || '["ubuntu-22.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          path: app
          ref: 98b340429436cf597a569549d043bd75b486e2ab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install application and external probe dependencies
        shell: bash
        run: |
          pnpm --dir app install --frozen-lockfile --ignore-scripts
          pnpm --dir harness install --frozen-lockfile --ignore-scripts
      - name: Install headless browser
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium
      - name: Exact-source field SDK regression
        working-directory: app
        run: node ../harness/qa/field374/sdk.mjs 98b340429436cf597a569549d043bd75b486e2ab .local/writer-481-QA-field-sdk
      - name: Normal source-bound application and full combination
        working-directory: app
        run: |
          node scripts/writer-proefbuild.mjs build .local/dist-481-QA-normal /
          node ../harness/scripts/office-writer-I3-qa.mjs .local/dist-481-QA-normal /
          node ../harness/qa/field374/browser.mjs 98b340429436cf597a569549d043bd75b486e2ab .local/dist-481-QA-normal / .local/writer-481-QA-field-normal
        env:
          OFFICE_TEST_SOURCE: 98b340429436cf597a569549d043bd75b486e2ab
      - name: Hosted source-bound application and full combination
        working-directory: app
        run: |
          node scripts/writer-proefbuild.mjs build .local/dist-481-QA-hosted /office/
          node ../harness/scripts/office-writer-I3-qa.mjs .local/dist-481-QA-hosted /office/
          node ../harness/qa/field374/browser.mjs 98b340429436cf597a569549d043bd75b486e2ab .local/dist-481-QA-hosted /office/ .local/writer-481-QA-field-hosted
        env:
          OFFICE_TEST_SOURCE: 98b340429436cf597a569549d043bd75b486e2ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer-481-browser-QA-${{ runner.os }}
          include-hidden-files: true
          path: |
            app/.local/writer-481-QA-*/
            app/.local/dist-481-QA-*.build.json
            harness/.github/office-writer-I3-qa.json
            harness/qa/field374/upstream-binding.json
