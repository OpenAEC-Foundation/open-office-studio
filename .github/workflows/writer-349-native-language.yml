name: Writer 349 native language acceptance
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Desktop CI run on the fixed combined G application point
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  NATIVE_BUILD_RUN: ${{ inputs.build_run }}
  NATIVE_APP_COMMIT: 9e0ad565402815082e8edf11a4c23943455fb6ce
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NATIVE_APP_COMMIT }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/native-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native runtime and driver dependencies
        run: |
          sudo python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 webkit2gtk-driver xvfb dbus-x11
          pnpm install --frozen-lockfile --ignore-scripts
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Verify and fetch the original checked DEB and package report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .local/native-harness/scripts/haal-writer-349-linux.py
      - name: Native edit, Ctrl+S and full process reopen on unchanged package
        env:
          OFFICE_NATIVE_ARTIFACT_RECHECK: "true"
          OFFICE_NATIVE_EXPECTED_SHA256: 6b254885cb8ba65c8e3cd75f29f132a473b0a32652b035ae4f2d5ee9719e67b9
          # #355: same CI-only graphics path as the packaged Linux smoke test.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          package=$(find .local/native-recheck-package -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' node .local/native-harness/scripts/proef-writer-349-native-language.mjs "$package"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer349-native-language-linux
          path: |
            .local/writer349-native-language-linux/
            .local/native-recheck-origin.json
          include-hidden-files: true
          if-no-files-found: warn
