name: Windows P2 native legacy STW case
on:
  push:
    branches: [codex/windows-stw-native-20261123]
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: contains(github.event.head_commit.message, '[windows-stw-go]')
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m pip install pywinauto==0.6.9
      - name: Real STW native picker IPC conversion edit and DOCX save/reopen
        run: node scripts/proef-windows-stw-native.mjs .github/windows-stw-native-candidate.json .local/windows-stw-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-stw-native-${{ github.sha }}
          path: |
            .local/windows-stw-native/*.json
            .local/windows-stw-native/*.png
            .local/windows-stw-native/*.docx
            .local/windows-stw-native/*.stw
            .local/windows-stw-native/*.log
            .github/windows-stw-native-candidate.json
          include-hidden-files: true
          if-no-files-found: warn
