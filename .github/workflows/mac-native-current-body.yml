name: Mac current candidate initial body baseline
on:
  push:
    branches: [codex/mac-native-body-blocker-20261120]
    paths: [.github/workflows/mac-native-current-body.yml, .github/mac-native-current-request.json]
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      OOS_361_EXECUTE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 420af640c10ab9ada6c66c844c0098caea87c493
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/mac-body-harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the successful Mac job and full canonical artifact before package derivation
        run: python .local/mac-body-harness/scripts/mac-native-current-fetch.py .local/mac-body-harness/.github/mac-native-current-request.json .local/mac-body-current-input
      - name: Capture untouched original and saved356 control; no body input
        run: python .local/mac-body-harness/scripts/mac-native-current-session.py .local/mac-body-current-input/identity.json .local/mac-body-current-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-current-body-baseline-${{ github.sha }}
          path: |
            .local/mac-body-current-baseline/
            .local/mac-body-current-input/identity.json
            .local/mac-body-current-input/request.json
            .local/mac-body-current-input/artifact-origin.json
          include-hidden-files: true
          if-no-files-found: error
