name: P5 Suite bounded save transport three-condition diagnostic
on:
  push:
    branches: [codex/mac-native-body-blocker-20261120]
    paths: [.github/workflows/mac-native-current-body.yml, .github/mac-native-current-request.json]
permissions:
  contents: read
  actions: read
jobs:
  product-acceptance:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      OOS_361_EXECUTE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b696ab86bd1c128729a079b68c0082e6df3d36a5
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/mac-body-harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify producer/app witness, Suite support descriptor and complete own child ZIP
        id: suite_fetch
        run: python .local/mac-body-harness/scripts/mac-native-suite-transfer-fetch.py .local/mac-body-harness/.github/mac-native-current-request.json .local/mac-save-transport-input
      - name: Three conditions on fresh copies; one Q and one CmdS each; maximum six copies
        run: python .local/mac-body-harness/scripts/mac-native-current-session.py .local/mac-save-transport-input/identity.json .local/mac-save-transport-native --acceptance --save-transport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-save-transport-${{ github.sha }}
          path: |
            .local/mac-save-transport-native/
            .local/mac-save-transport-input/*.json
            .local/mac-save-transport-input/*.log
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.suite_fetch.outcome == 'failure'
        with:
          name: mac-suite-failed-acquisition-${{ github.sha }}
          path: .local/mac-save-transport-input/*.zip
          include-hidden-files: true
          if-no-files-found: warn
