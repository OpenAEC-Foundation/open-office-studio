name: SDD native endpoint oracle replay
on:
  push:
    branches: [codex/sdd-qa-2026-11-23-e0d7]
    paths:
      - scripts/qa-sdd/analysis/**
      - .github/workflows/qa-sdd-analysis-e0d7.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  xml_analysis:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the small exact previous result, no Office/runtime download
        run: |
          python -m py_compile scripts/qa-sdd/analysis/*.py
          python scripts/qa-sdd/analysis/consume.py
      - name: Verify original native endpoints against unchanged actual outputs
        run: python scripts/qa-sdd/analysis/line_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdd-native-oracle-replay
          path: .local/sdd-analysis/
          include-hidden-files: true
          if-no-files-found: error
