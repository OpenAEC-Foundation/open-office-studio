name: Office browser regressions
on:
  pull_request:
    paths:
      - "src/OfficeStudio.tsx"
      - "src/TabBalk.tsx"
      - "src/export/koppeling.ts"
      - "src/export/editorKoppeling.ts"
      - "src/export/**"
      - "src/lint/**"
      - "src/tekst/stijlen/**"
      - "src/import/**"
      - "src/stijl/openaec-office.css"
      - "src/presentatie/**"
      - "scripts/test-presentatie-zoeklimiet.mjs"
      - "scripts/proef-presentatie-media-pauze.mjs"
      - "scripts/proef-presentatie-poster-capture.mjs"
      - "scripts/test-presentatie-odf-volume.mjs"
      - "scripts/test-writer-pdf-interne-links.mjs"
      - "scripts/test-office-tab-undo.mjs"
      - "scripts/writer-*.mjs"
      - "scripts/proef-writer-*.mjs"
      - "scripts/proef-epub356-hosted.mjs"
      - ".github/workflows/office-tab-focus.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run src/useTabSneltoetsen.test.ts src/tabbladen.test.ts src/lint/sneltoetsen.test.ts
      - run: pnpm exec vitest run scripts/writer-proefbuild.test.mjs scripts/writer-363-resources.test.mjs scripts/proef-writer-363-labels.test.mjs scripts/tekstnavigatie-macos.test.ts src/lint/tekst-kolomfocus.test.ts src/tekst/stijlen/StijlBeheerGroep.test.tsx src/import/epubbestand.test.ts
      - run: node --test scripts/proef-epub356-hosted-startup.node-test.mjs
      - name: Build source-bound production frontend
        run: node scripts/writer-proefbuild.mjs build .local/dist-focus /
        env:
          OFFICE_TEST_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Production frontend and document-tab regression
        run: |
          node scripts/test-office-tab-undo.mjs
        env:
          OOS_TEST_DIST: .local/dist-focus
          OOS_TEST_UIT: .local/tab-focus
      - name: Combined Writer issues 356, 361, 362 and 363
        run: node scripts/writer-combinatie-proef.mjs .local/dist-focus /
        env:
          OFFICE_TEST_BUILD_RECEIPT: .local/dist-focus.build.json
      - name: Presentation and Writer production regressions
        if: runner.os == 'Linux'
        run: |
          node scripts/test-presentatie-odf-volume.mjs prepare
          node scripts/proef-presentatie-media-pauze.mjs .local/dist-focus
          node scripts/proef-presentatie-poster-capture.mjs .local/dist-focus
          node scripts/test-presentatie-zoeklimiet.mjs
          node scripts/test-writer-pdf-interne-links.mjs
        env:
          OFFICE_TEST_DIST: .local/dist-focus
      - name: Build source-bound hosted frontend
        run: node scripts/writer-proefbuild.mjs build .local/dist-focus-hosted /office/
        env:
          OFFICE_TEST_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Standalone hosted browser route
        run: node scripts/test-office-tab-undo.mjs
        env:
          OOS_TEST_DIST: .local/dist-focus-hosted
          OOS_TEST_ROUTE: /office/
          OOS_TEST_UIT: .local/tab-focus-hosted
      - name: Combined Writer issues on the supported hosted route
        run: node scripts/writer-combinatie-proef.mjs .local/dist-focus-hosted /office/
        env:
          OFFICE_TEST_BUILD_RECEIPT: .local/dist-focus-hosted.build.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-tab-focus-${{ runner.os }}
          path: |
            .local/tab-focus/
            .local/tab-focus-hosted/
            .local/presentatie-media-pauze/
            .local/presentatie-poster-capture/
            .local/presentation-truncation-fixed/
            .local/writer-pdf-interne-links/
            .local/dist-focus.build.json
            .local/dist-focus-hosted.build.json
            .local/writer-combination-*/
          include-hidden-files: true
