name: Office document tab focus
on:
  pull_request:
    paths:
      - "src/OfficeStudio.tsx"
      - "src/TabBalk.tsx"
      - "src/export/koppeling.ts"
      - "src/export/editorKoppeling.ts"
      - "scripts/test-office-tab-undo.mjs"
      - ".github/workflows/office-tab-focus.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run src/useTabSneltoetsen.test.ts src/tabbladen.test.ts src/lint/sneltoetsen.test.ts
      - name: Production frontend and document-tab regression
        run: |
          pnpm exec vite build --outDir .local/dist-focus --logLevel error
          node scripts/test-office-tab-undo.mjs
        env:
          OOS_TEST_DIST: .local/dist-focus
          OOS_TEST_UIT: .local/tab-focus
      - name: Standalone hosted browser route
        run: |
          pnpm exec vite build --base=./ --mode hosted --outDir .local/dist-focus-hosted --logLevel error
          node scripts/test-office-tab-undo.mjs
        env:
          OOS_TEST_DIST: .local/dist-focus-hosted
          OOS_TEST_ROUTE: /office/
          OOS_TEST_UIT: .local/tab-focus-hosted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-tab-focus-${{ runner.os }}
          path: |
            .local/tab-focus/
            .local/tab-focus-hosted/
          include-hidden-files: true
