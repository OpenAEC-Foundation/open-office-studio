name: EPUB 356 frozen canonical native acceptance
on:
  push:
    branches: [codex/formats-356-final-acceptance-2026-11-20]
    paths: [.github/epub356-final-candidate.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: epub356-final-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      source: ${{ steps.plan.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: |
          node --input-type=module -e '
            import {readFileSync,appendFileSync} from "node:fs";
            import {validatePlan} from "./scripts/epub356-final-artifacts.mjs";
            const plan=validatePlan(JSON.parse(readFileSync(".github/epub356-final-candidate.json","utf8")));
            appendFileSync(process.env.GITHUB_OUTPUT,`source=${plan.applicationCommit}\n`);
          '
  native:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OOS_RUNTIME_HARNESS_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: actions/checkout@v4
        with:
          path: .local/harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
      - name: Isolated Linux native testing tools
        if: runner.os == 'Linux'
        run: |
          sudo python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev squashfs-tools webkit2gtk-driver xvfb imagemagick xdotool x11-utils dbus-x11 xdg-desktop-portal xdg-desktop-portal-gtk
          cargo install tauri-driver --version 2.1.0 --locked
      - run: pnpm install --frozen-lockfile
      - name: Download and verify exact root artifact and installer hashes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .local/harness/scripts/epub356-final-artifacts.mjs .local/harness/.github/epub356-final-candidate.json ${{ runner.os }} .local/epub356-final-installers
      - name: Prepare only dedicated copied test drivers
        run: node .local/harness/scripts/epub356-final-prepare.mjs scripts
      - name: Native EPUB open, real file dialog save, oracle and fresh process reopen
        if: runner.os != 'Linux'
        run: node .local/harness/scripts/epub356-final-native.mjs .local/harness/.github/epub356-final-candidate.json ${{ runner.os }} .local/epub356-final-installers .local/epub356-final-native
      - name: Real DEB and AppImage save/reopen in private X11 and D-Bus session
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: dbus-run-session -- xvfb-run -a node .local/harness/scripts/epub356-final-native.mjs .local/harness/.github/epub356-final-candidate.json Linux .local/epub356-final-installers .local/epub356-final-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epub356-final-native-${{ runner.os }}
          path: .local/epub356-final-native
          include-hidden-files: true
          if-no-files-found: warn
