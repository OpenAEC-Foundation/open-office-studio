name: Zelfstandig kantoorvoorbeeld controleren
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voorbeeld:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/voorbeeld/src/protocol.test.ts
      - run: pnpm voorbeeld:build
      - name: Verpakt resultaat in losse browserhost testen
        env:
          CHROME_PAD: /usr/bin/google-chrome
        run: pnpm voorbeeld:test
      - name: Pakket en controlebewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zelfstandig-kantoorvoorbeeld
          path: |
            .local/voorbeeldproef-*/*.tgz
            .local/voorbeeldproef-*/controle.json
            .local/voorbeeldproef-*/*.png
          include-hidden-files: true
          retention-days: 14
