name: P4 unchanged DEB resolver and native recheck
on:
  push:
    branches: [codex/p4-linux-native-install-recheck-2026-11-23]
    paths:
      - .github/workflows/p4-native-install-recheck.yml
      - scripts/p4-native-recheck-input.py
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04fa6cd43b84e3f59fb9d5055bb2d00dde351a47
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/native-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install drivers without preinstalling the package dependency Zenity
        run: |
          sudo python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 webkit2gtk-driver xvfb dbus-x11
          ! command -v zenity
          pnpm install --frozen-lockfile --ignore-scripts
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Verify original failed job and unchanged checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .local/native-harness/scripts/p4-native-recheck-input.py
      - name: Resolve declared dependencies and run preserved native roundtrip
        env:
          OFFICE_NATIVE_ARTIFACT_RECHECK: "true"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          package=$(find .local/native-recheck-package -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --field "$package" Depends | tee .local/p4-native-original/depends.txt
          dbus-run-session -- xvfb-run -a node .local/native-harness/scripts/proef-native-linux-basis.mjs "$package"
          dpkg-query -W zenity | tee .local/p4-native-original/resolved-zenity.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.local/native-linux-basis/report.json').read_text())
          assert report['status'] == 'passed' and report['ownedApplicationClosed'] is True
          assert report['sourceCommit'] == '04fa6cd43b84e3f59fb9d5055bb2d00dde351a47'
          assert report['executableSha256'] == report['packagedExecutableSha256'] == 'ee4ed6255cd99a354fa9bccd8c0e990e6f30fd9f1e71f0448e464af3f5d53cb9'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-native-install-recheck
          path: |
            .local/native-linux-basis/
            .local/native-recheck-origin.json
            .local/pakketcontrole-Linux.json
            .local/p4-native-original/*.json
            .local/p4-native-original/*.txt
          include-hidden-files: true
          if-no-files-found: warn
