name: Native Linux Writer artifact recheck
on:
  push:
    branches: [codex/native-linux-353-2026-11-16]
    paths:
      - scripts/proef-native-linux-basis.mjs
      - scripts/haal-native-linux-ci.py
      - .github/workflows/native-linux-353.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  NATIVE_BUILD_RUN: "43838167666"
  NATIVE_APP_COMMIT: e1f84f84f4d72e5ce8ab967e376a6f38344edf39
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NATIVE_APP_COMMIT }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/native-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native runtime and driver dependencies
        run: |
          sudo python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 webkit2gtk-driver xvfb dbus-x11
          pnpm install --frozen-lockfile --ignore-scripts
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Verify and fetch the original checked DEB and package report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .local/native-harness/scripts/haal-native-linux-ci.py
      - name: Native edit, Ctrl+S and full process reopen on unchanged package
        env:
          OFFICE_NATIVE_ARTIFACT_RECHECK: "true"
          # #355: same CI-only graphics path as the packaged Linux smoke test.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          package=$(find .local/native-recheck-package -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          dbus-run-session -- xvfb-run -a node .local/native-harness/scripts/proef-native-linux-basis.mjs "$package"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-writer-recheck
          path: |
            .local/native-linux-basis/
            .local/native-recheck-origin.json
          include-hidden-files: true
          if-no-files-found: warn
