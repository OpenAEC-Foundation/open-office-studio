name: Rekenbladkern kandidaat bouwen
on:
  push:
    branches: [codex/spreadsheet-five-e0d7, codex/spreadsheet-tables-73-d410, codex/spreadsheet-73-wip-d410]
    paths:
      - .github/workflows/rekenbladkern-kandidaat.yml
      - patches/rekenbladengine-*
      - scripts/bouw-rekenbladkern.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kern:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Vastgezette bouwgereedschappen installeren
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.98.1
          mkdir -p .local/tools
          cd .local/tools
          curl -fL --retry 3 -o bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  bindgen.tar.gz' | sha256sum -c -
          curl -fL --retry 3 -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz
          echo '195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572  binaryen.tar.gz' | sha256sum -c -
          tar -xzf bindgen.tar.gz
          tar -xzf binaryen.tar.gz
          echo "$PWD/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          echo "$PWD/binaryen-version_132/bin" >> "$GITHUB_PATH"
      - name: Bronpatches testen en kandidaat bouwen
        run: python3 scripts/bouw-rekenbladkern.py --bronmap .local/kernbron --uitvoer .local/kern-kandidaat --controle --nieuwe-kern
      - uses: actions/upload-artifact@v4
        with:
          name: rekenbladkern-kandidaat
          path: .local/kern-kandidaat/
          include-hidden-files: true
          if-no-files-found: error
