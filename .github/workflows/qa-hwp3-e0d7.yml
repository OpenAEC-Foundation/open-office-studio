name: HWP3 bounded native oracle and real Word route
on:
  push:
    branches: [codex/hwp3-qa-2026-11-24-e0d7]
    paths: [scripts/qa-hwp3/run-request.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  targeted_linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OOS_HWP3_RUNTIME_BINDING: .local/hwp3-qa/runtime-binding.json
    steps:
      - uses: actions/checkout@v4
      - name: Give queued P5 critical Linux jobs priority
        run: python3 scripts/qa-hwp3/capacity.py
      - run: git fetch --no-tags --depth=1 origin dc3f8d5d6e8fdffaaec82caa4ab93b579e075e6b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Derive original native text CR controls and independent Korean charset oracle oracle before conversion
        run: python -B scripts/qa-hwp3/oracle.py source
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Negative actual production browser-capability boundary
        run: node scripts/qa-hwp3/engine.mjs --route-only
      - name: Headless runtime dependencies only; no app build
        run: |
          sudo python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2 libcups2 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0 libice6 libnss3 libsm6 libx11-6 libxext6 libxinerama1 libxrandr2 libxrender1 libxslt1.1 libgl1 libglu1-mesa
      - name: Recheck P5 queue immediately before private runtime consumption
        run: python -B scripts/qa-hwp3/capacity.py
      - name: Verify only existing shared private runtime-only artifact
        run: python scripts/qa-hwp3/runtime_input.py
      - name: Actual P2 helper converter and Word edit Undo Redo DOCX save fresh reopen
        run: node scripts/qa-hwp3/engine.mjs
      - name: Reopen saved DOCX in a separate Node process and inspect independent XML
        if: always()
        run: |
          if test -f .local/hwp3-qa/saved.docx; then node scripts/qa-hwp3/fresh_reopen.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hwp3-targeted-result
          path: .local/hwp3-qa/
          include-hidden-files: true
          if-no-files-found: error
