name: Standalone Linux final P2 installer acceptance
on:
  push:
    branches: [codex/standalone-linux-final-p2-2026-11-23]
    paths: [docs/tests/standalone-linux-final-p2-request.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  STANDALONE_APP_COMMIT: dc3f8d5d6e8fdffaaec82caa4ab93b579e075e6b
  STANDALONE_BUILD_RUN: "45150438420"
  STANDALONE_LINUX_JOB: "137610274931"
  STANDALONE_PURPOSE: frozen-candidate-acceptance
jobs:
  prepare:
    name: Verify one canonical Linux ZIP and split unchanged standalone bytes
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STANDALONE_APP_COMMIT }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/standalone-harness
      - name: Provenance contracts and own Linux source/job/artifact/ZIP gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 .local/standalone-harness/scripts/test-standalone-linux-provenance.py
          /usr/bin/python3 .local/standalone-harness/scripts/haal-standalone-linux-ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-writer
          path: .local/standalone-linux-prepared/writer/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-spreadsheet
          path: .local/standalone-linux-prepared/spreadsheet/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-presentation
          path: .local/standalone-linux-prepared/presentation/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-email
          path: .local/standalone-linux-prepared/email/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-notition
          path: .local/standalone-linux-prepared/notition/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-database
          path: .local/standalone-linux-prepared/database/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-linux-input-preparation
          path: |
            .local/standalone-linux-prepared/preparation-receipt.json
            .local/standalone-linux-prepared/*/origin.json
            .local/standalone-linux-prepared/*/pakketcontrole-*.json
          include-hidden-files: true
          if-no-files-found: warn
  standalone:
    needs: prepare
    name: Independent ${{ matrix.app }} DEB and AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: [writer, spreadsheet, presentation, email, notition, database]
    env:
      STANDALONE_APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STANDALONE_APP_COMMIT }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/standalone-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Only OS libraries and native test tools, no Office suite
        run: |
          sudo /usr/bin/python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo /usr/bin/python3 - <<'PYCODE'
          import importlib.util,pathlib
          spec=importlib.util.spec_from_file_location('ubuntu_mirror','scripts/gebruik-ubuntu-hoofdarchief.py')
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          for name in ['apt-mirrors.txt','apt-mirrors-security.txt']:
              path=pathlib.Path('/etc/apt')/name
              if path.is_file():
                  before=path.read_text();after=helper.herschrijf_bronnen(before)
                  if before!=after:path.write_text(after)
          PYCODE
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 webkit2gtk-driver xvfb dbus-x11 xdotool x11-utils python3-gi gir1.2-gtk-3.0 libfuse2 squashfs-tools gnome-keyring libsecret-tools openbox xdg-desktop-portal xdg-desktop-portal-gtk imagemagick
          pnpm --dir .local/standalone-harness install --frozen-lockfile --ignore-scripts
          node --check .local/standalone-harness/scripts/proef-standalone-linux.mjs
          node --check .local/standalone-harness/scripts/standalone-linux-gnm-native.mjs
          node --test .local/standalone-harness/scripts/standalone-linux-mail-fixture.test.mjs .local/standalone-harness/scripts/standalone-linux-ooxml.test.mjs
          /usr/bin/python3 .local/standalone-harness/scripts/format30-gnm/oracle_test.py
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Verify and download only own app input artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 .local/standalone-harness/scripts/haal-standalone-app-input.py
      - name: Real isolated native core and full-reopen acceptance
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          xvfb-run -a -s '-screen 0 1800x1200x24 -noreset' dbus-run-session -- bash <<'SH'
          set -euo pipefail
          mkdir -p .local/standalone-linux-results
          openbox > .local/standalone-linux-results/openbox.log 2>&1 &
          standalone_wm=$!
          trap 'kill "$standalone_wm" 2>/dev/null || true' EXIT
          dbus-update-activation-environment DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP
          node .local/standalone-harness/scripts/proef-standalone-linux.mjs
          SH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-linux-${{ matrix.app }}
          path: |
            .local/standalone-linux-results/
            .local/standalone-linux-input/origin.json
            .local/standalone-linux-input/input-artifact-receipt.json
            .local/standalone-linux-input/pakketcontrole-*.json
            .local/linux-p2-native/
          include-hidden-files: true
          if-no-files-found: warn
