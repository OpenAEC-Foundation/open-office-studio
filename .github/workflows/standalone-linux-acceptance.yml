name: Standalone Linux installer acceptance
on:
  push:
    branches: [codex/standalone-linux-2026-11-23]
    paths: [docs/tests/standalone-linux-request.json]
  workflow_dispatch:
    inputs:
      application_commit:
        description: Exact frozen 40-character application source commit
        required: true
        type: string
      artifact_run:
        description: Release workflow run containing canonical uitgave-Linux
        required: true
        type: string
      host_preflight_only:
        description: Test only old Notition bytes as host/driver preflight; never final acceptance
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  request:
    runs-on: ubuntu-22.04
    outputs:
      source: ${{ steps.request.outputs.source }}
      run: ${{ steps.request.outputs.run }}
      apps: ${{ steps.request.outputs.apps }}
      purpose: ${{ steps.request.outputs.purpose }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate explicit frozen source and acceptance purpose
        id: request
        env:
          INPUT_SOURCE: ${{ inputs.application_commit }}
          INPUT_RUN: ${{ inputs.artifact_run }}
          INPUT_PREFLIGHT: ${{ inputs.host_preflight_only }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const c=process.env.GITHUB_EVENT_NAME==='push' ? JSON.parse(readFileSync('docs/tests/standalone-linux-request.json')) : {source:process.env.INPUT_SOURCE,run:process.env.INPUT_RUN,hostPreflightOnly:process.env.INPUT_PREFLIGHT==='true'};
          assert.match(c.source,/^[0-9a-f]{40}$/); assert.match(String(c.run),/^\d+$/); assert.equal(typeof c.hostPreflightOnly,'boolean');
          const apps=c.hostPreflightOnly?['notition']:['writer','spreadsheet','presentation','email','notition','database'];
          const purpose=c.hostPreflightOnly?'host-driver-preflight-NOT-final-acceptance':'frozen-candidate-acceptance';
          appendFileSync(process.env.GITHUB_OUTPUT,`source=${c.source}\nrun=${c.run}\napps=${JSON.stringify(apps)}\npurpose=${purpose}\n`);
          JS
  prepare:
    needs: request
    name: Verify canonical Linux artifact once and split unchanged app bytes
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      STANDALONE_APP_COMMIT: ${{ needs.request.outputs.source }}
      STANDALONE_BUILD_RUN: ${{ needs.request.outputs.run }}
      STANDALONE_PURPOSE: ${{ needs.request.outputs.purpose }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.source }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/standalone-harness
      - name: Verify one canonical ZIP and extract only twelve standalone packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .local/standalone-harness/scripts/haal-standalone-linux-ci.py
      - uses: actions/upload-artifact@v4
        if: needs.request.outputs.purpose == 'frozen-candidate-acceptance'
        with:
          name: standalone-input-writer
          path: .local/standalone-linux-prepared/writer/
          include-hidden-files: true
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: needs.request.outputs.purpose == 'frozen-candidate-acceptance'
        with:
          name: standalone-input-spreadsheet
          path: .local/standalone-linux-prepared/spreadsheet/
          include-hidden-files: true
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: needs.request.outputs.purpose == 'frozen-candidate-acceptance'
        with:
          name: standalone-input-presentation
          path: .local/standalone-linux-prepared/presentation/
          include-hidden-files: true
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: needs.request.outputs.purpose == 'frozen-candidate-acceptance'
        with:
          name: standalone-input-email
          path: .local/standalone-linux-prepared/email/
          include-hidden-files: true
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-input-notition
          path: .local/standalone-linux-prepared/notition/
          include-hidden-files: true
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: needs.request.outputs.purpose == 'frozen-candidate-acceptance'
        with:
          name: standalone-input-database
          path: .local/standalone-linux-prepared/database/
          include-hidden-files: true
          compression-level: 0
  standalone:
    needs: [request, prepare]
    name: Independent ${{ matrix.app }} (DEB and AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: ${{ fromJSON(needs.request.outputs.apps) }}
    env:
      STANDALONE_APP_COMMIT: ${{ needs.request.outputs.source }}
      STANDALONE_BUILD_RUN: ${{ needs.request.outputs.run }}
      STANDALONE_APP: ${{ matrix.app }}
      STANDALONE_PURPOSE: ${{ needs.request.outputs.purpose }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.source }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/standalone-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install only OS libraries and native test tools
        run: |
          sudo python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 webkit2gtk-driver xvfb dbus-x11 xdotool libfuse2 squashfs-tools gnome-keyring libsecret-tools
          pnpm --dir .local/standalone-harness install --frozen-lockfile --ignore-scripts
          cargo install tauri-driver --version 2.1.0 --locked
      - uses: actions/download-artifact@v4
        with:
          name: standalone-input-${{ matrix.app }}
          path: .local/standalone-linux-input
      - name: Native isolated DEB and AppImage functionality
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: dbus-run-session -- xvfb-run -a node .local/standalone-harness/scripts/proef-standalone-linux.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-linux-${{ matrix.app }}
          path: |
            .local/standalone-linux-results/
            .local/standalone-linux-input/origin.json
            .local/standalone-linux-input/pakketcontrole-*.json
          include-hidden-files: true
          if-no-files-found: warn
