name: GNM Linux native P2 DEB acceptance
on:
  push:
    branches: [codex/gnm-linux-native-p2-2026-11-23]
    paths:
      [
        .github/workflows/gnm-linux-native-p2.yml,
        scripts/proef-gnm-linux-native.mjs,
        scripts/linux-p2-*,
        scripts/format30-gnm/**,
        tests/fixtures/gnm-linux/**,
        tests/fixtures/linux-p2/**,
      ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  APP_SOURCE: dc3f8d5d6e8fdffaaec82caa4ab93b579e075e6b
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SOURCE }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/gnm-linux-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Native disposable host dependencies
        run: |
          sudo /usr/bin/python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo /usr/bin/python3 - <<'PY'
          import importlib.util,pathlib
          spec=importlib.util.spec_from_file_location('ubuntu_mirror','scripts/gebruik-ubuntu-hoofdarchief.py')
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          for name in ['apt-mirrors.txt','apt-mirrors-security.txt']:
              path=pathlib.Path('/etc/apt')/name
              if path.is_file():
                  before=path.read_text();after=helper.herschrijf_bronnen(before)
                  if before!=after:path.write_text(after)
          PY
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 webkit2gtk-driver xvfb dbus-x11 xdotool x11-utils python3-gi gir1.2-gtk-3.0 openbox xdg-desktop-portal xdg-desktop-portal-gtk
          cargo install tauri-driver --version 2.1.0 --locked
          pnpm --dir .local/gnm-linux-harness install --frozen-lockfile --ignore-scripts
      - name: Validate harness and genuine upstream fixture oracle
        run: |
          node --check .local/gnm-linux-harness/scripts/proef-gnm-linux-native.mjs
          /usr/bin/python3 .local/gnm-linux-harness/scripts/format30-gnm/oracle_test.py
      - name: Verify exact recovery archive, native DEB and installed P2 ELF
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 .local/gnm-linux-harness/scripts/linux-p2-native-package.py
      - name: Native preflight and GNM picker-edit-XLSX-quit-reopen acceptance
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          xvfb-run -a -e .local/gnm-linux-xvfb.log -s '-screen 0 1800x1200x24 -noreset' dbus-run-session -- bash -euc '
            openbox > .local/gnm-linux-openbox.log 2>&1 &
            wm=$!
            trap "kill $wm 2>/dev/null || true" EXIT
            dbus-update-activation-environment DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP
            node .local/gnm-linux-harness/scripts/proef-gnm-linux-native.mjs
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnm-linux-native-p2-${{ github.sha }}
          path: |
            .local/linux-p2-input/identity.json
            .local/linux-p2-input/api-run.json
            .local/linux-p2-input/native-input-descriptor.json
            .local/linux-p2-input/canonical-package-report.json
            .local/linux-p2-native/**/*.json
            .local/linux-p2-native/**/*.png
            .local/linux-p2-native/*.xlsx
            .local/linux-p2-native/*.gnm
            .local/linux-p2-native/*.gnumeric
            .local/linux-p2-native/driver.log
            .local/gnm-linux-xvfb.log
            .local/gnm-linux-openbox.log
          include-hidden-files: true
          if-no-files-found: warn
