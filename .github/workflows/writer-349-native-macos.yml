name: Writer 349 native macOS acceptance
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Desktop CI run on the fixed combined G application point
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e0ad565402815082e8edf11a4c23943455fb6ce
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/349-harness
      - name: Verify fixed combined G artifact and package bytes
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_BUILD_RUN: ${{ inputs.build_run }}
        run: python3 .local/349-harness/scripts/haal-writer-349-macos.py
      - name: Actual native AX language, keyboard, save and process reopen
        run: python3 .local/349-harness/scripts/proef-writer-349-macos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer349-native-language-macOS
          path: |
            .local/writer349-native-macos/*.json
            .local/writer349-native-macos/*.png
            .local/writer349-native-macos/*.docx
            .local/writer349-native-macos/app-manifest.txt
          include-hidden-files: true
          if-no-files-found: warn
