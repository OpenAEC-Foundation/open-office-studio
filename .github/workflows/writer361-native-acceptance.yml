name: Writer 361 isolated native acceptance
on:
  push:
    branches: [codex/writer-361-native-acceptance-20261120]
    paths:
      - .github/workflows/writer361-native-acceptance.yml
      - .github/writer361-mac-browser-I2.json
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [compile-only, linux, macos, browser-only-mac, browser-only-mac-361-diagnostic]
        default: compile-only
      execute_native:
        type: boolean
        default: false
      execute_browser:
        type: boolean
        default: false
      frozen_manifest:
        description: Immutable platform artifact manifest JSON, supplied by integration
        type: string
        default: ""
      frozen_manifest_sha256:
        description: SHA256 of sorted compact UTF-8 manifest JSON
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: writer361-native-${{ github.ref }}-${{ inputs.profile || 'compile-only' }}
  cancel-in-progress: false
jobs:
  compile-macos:
    # Bootstrap compile already passed on 45bf92b5; later QA edits do not repeat it.
    if: (github.event_name == 'push' && github.sha == '45bf92b52cd353384d68ada85002e97242fb9159') || (github.event_name == 'workflow_dispatch' && inputs.profile == 'compile-only')
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile driver and check protocol syntax; no application or GUI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/writer361-compile
          xcrun swiftc scripts/writer-361-macos-ax.swift -o .local/writer361-compile/writer361-ax >.local/writer361-compile/swift.log 2>&1
          node --check scripts/proef-writer-361-linux.mjs
          python -m py_compile scripts/proef-writer-361-macos.py scripts/writer361-native-manifest.py scripts/proef-writer-361-macos-session.py
          python scripts/proef-writer-361-macos.py --help >.local/writer361-compile/protocol-help.txt
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          paths=['scripts/writer-361-macos-ax.swift','scripts/proef-writer-361-macos.py','scripts/proef-writer-361-linux.mjs','.local/writer361-compile/writer361-ax']
          report={'harnessCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'scope':'Swift compile and Python/Node protocol syntax only','nativeApplicationStarted':False,'nativeAcceptance':'not executed','files':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},'swiftVersion':subprocess.check_output(['xcrun','swift','--version'],text=True).strip()}
          pathlib.Path('.local/writer361-compile/report.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer361-compile-${{ github.sha }}
          path: .local/writer361-compile/
          include-hidden-files: true
          if-no-files-found: error
  plan:
    if: github.event_name == 'workflow_dispatch' && (inputs.profile == 'linux' || inputs.profile == 'macos')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.manifest.outputs.source_commit }}
      runner: ${{ steps.manifest.outputs.runner }}
      ribbon_commit: ${{ steps.manifest.outputs.ribbon_commit }}
      styles_commit: ${{ steps.manifest.outputs.styles_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: manifest
        env:
          EXECUTE_NATIVE: ${{ inputs.execute_native }}
          FROZEN_MANIFEST: ${{ inputs.frozen_manifest }}
          FROZEN_MANIFEST_SHA256: ${{ inputs.frozen_manifest_sha256 }}
          NATIVE_PROFILE: ${{ inputs.profile }}
        run: python3 scripts/writer361-native-manifest.py plan "$NATIVE_PROFILE" .local/writer361-manifest.json
  native:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.execute_native && needs.plan.result == 'success'
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 30
    env:
      EXECUTE_NATIVE: ${{ inputs.execute_native }}
      FROZEN_MANIFEST: ${{ inputs.frozen_manifest }}
      FROZEN_MANIFEST_SHA256: ${{ inputs.frozen_manifest_sha256 }}
      NATIVE_PROFILE: ${{ inputs.profile }}
      GH_TOKEN: ${{ github.token }}
      OOS_361_EXECUTE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_commit }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/writer361-harness
      - uses: actions/checkout@v4
        if: runner.os == 'Linux' && needs.plan.outputs.ribbon_commit != ''
        with:
          ref: ${{ needs.plan.outputs.ribbon_commit }}
          path: .local/writer362-harness
      - uses: actions/checkout@v4
        if: runner.os == 'Linux' && needs.plan.outputs.styles_commit != ''
        with:
          ref: ${{ needs.plan.outputs.styles_commit }}
          path: .local/writer363-harness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and verify only the frozen canonical artifact; no build
        run: python .local/writer361-harness/scripts/writer361-native-manifest.py fetch "$NATIVE_PROFILE" .local/writer361-manifest.json
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
      - name: Existing Linux native runtime/driver dependencies
        if: runner.os == 'Linux'
        run: |
          sudo python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 webkit2gtk-driver xvfb dbus-x11 xdotool
          cargo install tauri-driver --version 2.1.0 --locked
          pnpm --dir .local/writer361-harness install --frozen-lockfile --ignore-scripts
      - name: Linux native 361 and optional separately pinned 362/363 modules
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          identity=json.loads(pathlib.Path('.local/input/identity.json').read_text())
          env=dict(os.environ)
          ribbon=identity.get('ribbonHarness')
          if ribbon:
            pathlib.Path('.local/writer362-harness/node_modules').symlink_to(pathlib.Path('.local/writer361-harness/node_modules').resolve(),target_is_directory=True)
            env.update(OOS_362_NATIVE_MODULE=str(pathlib.Path('.local/writer362-harness/scripts/writer362-native-probe.mjs').resolve()),OOS_362_NATIVE_MODULE_SHA256=ribbon['sha256'],OOS_362_NATIVE_COMMIT=ribbon['commit'])
          styles=identity.get('stylesHarness')
          if styles:
            env.update(OOS_363_NATIVE_MODULE=str(pathlib.Path('.local/writer363-harness/scripts/proef-writer-363-native-labels.mjs').resolve()),OOS_363_NATIVE_MODULE_SHA256=styles['sha256'],OOS_363_NATIVE_COMMIT=styles['commit'])
          subprocess.run(['dbus-run-session','--','xvfb-run','-a','-s','-screen 0 1800x1200x24','node','.local/writer361-harness/scripts/proef-writer-361-linux.mjs','.local/input/identity.json','.local/writer361-native'],env=env,check=True)
          PY
      - name: macOS native bounded core route on the same canonical artifact
        if: runner.os == 'macOS'
        run: python .local/writer361-harness/scripts/proef-writer-361-macos-session.py .local/input/identity.json .local/writer361-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer361-native-${{ runner.os }}-${{ needs.plan.outputs.source_commit }}
          path: |
            .local/writer361-native/
            .local/writer361-manifest.json
            .local/input/identity.json
            .local/input/artifact-origin.json
            .local/input/root-frozen-candidate.json
          include-hidden-files: true
          if-no-files-found: warn
  browser-macos-I2:
    # One approved request push, independent of default-branch dispatch registration.
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[writer361-mac-browser-I2]')) || (github.event_name == 'workflow_dispatch' && inputs.profile == 'browser-only-mac' && inputs.execute_browser)
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      WRITER361_BROWSER_REQUEST_SHA256: 8b715cf8a1c1f5916dd6609983274926318fb5937731a1089e7979f0c4688bd6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
      - name: Verify immutable browser-only I2 request before any app build
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          raw=pathlib.Path('harness/.github/writer361-mac-browser-I2.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['WRITER361_BROWSER_REQUEST_SHA256']
          c=json.loads(raw)
          assert c['profile']=='browser-only-mac' and c['executionApproved'] is True
          assert c['sourceCommit']=='5acab18c516e1fb07118cb41f807a3c0e05182bf' and c['sourceTree']=='f857aabbca465d3135f38d9a95b8ad0863ea76b1'
          assert c['nativeAppExecutionAllowed'] is False and c['installerBuildAllowed'] is False
          assert hashlib.sha256(pathlib.Path('harness/scripts/proef-writer-kolom-undo.mjs').read_bytes()).hexdigest()==c['correctedProbeSha256']
          PY
      - uses: actions/checkout@v4
        with:
          ref: 5acab18c516e1fb07118cb41f807a3c0e05182bf
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Locked application frontend dependencies and real macOS Chromium
        run: |
          pnpm --dir app install --frozen-lockfile --ignore-scripts
          pnpm --dir app exec playwright install --with-deps chromium
      - name: Canonical I2 normal and hosted builds, corrected 361 and existing other probes
        run: node harness/scripts/writer361-i2-mac-browser.mjs app harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer361-I2-real-mac-browser-${{ github.sha }}
          path: |
            app/.local/writer361-I2-mac-*/
            app/.local/writer361-I2-mac-browser-summary.json
            app/.local/dist-writer361-I2-mac-normal.build.json
            app/.local/dist-writer361-I2-mac-hosted.build.json
            harness/.github/writer361-mac-browser-I2.json
          include-hidden-files: true
          if-no-files-found: warn

  browser-macos-I3-361-diagnostic:
    # Exactly one normal-route diagnostic on frozen I3, explicit dispatch only.
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'browser-only-mac-361-diagnostic' && inputs.execute_browser
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      WRITER361_DIAGNOSTIC_REQUEST_SHA256: 162c2d0c23b5d53e7259c310b49a538dea3d422d00b456dee8b87cacdbda683e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: 7f126f4b8e5269a54388cf78c48c78d2acc0daa1
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Locked I3 frontend dependencies and actual macOS Chromium
        run: |
          pnpm --dir app install --frozen-lockfile --ignore-scripts
          pnpm --dir app exec playwright install --with-deps chromium
      - name: One normal-route 361 keyboard and delayed-grid diagnostic, no input replay
        run: node harness/scripts/writer361-i3-mac-diagnostic.mjs app harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer361-I3-mac-diagnostic-${{ github.sha }}
          path: |
            app/.local/writer361-I3-mac-diagnostic-trial-*/
            app/.local/writer361-I3-mac-diagnostic-summary.json
            app/.local/dist-writer361-I3-mac-diagnostic.build.json
            harness/.github/writer361-mac-I3-diagnostic.json
          include-hidden-files: true
          if-no-files-found: warn
