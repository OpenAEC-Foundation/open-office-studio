name: P2 isolated STI source and route QA
on:
  push:
    branches: [codex/qa-sti-p2-2026-11-23-0c73]
    paths:
      - qa/sti-p2-2026-11-23-0c73/**
      - .github/workflows/qa-sti-p2-0c73.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sti-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OOS_STI_APPLICATION: dc3f8d5d6e8fdffaaec82caa4ab93b579e075e6b
      GH_TOKEN: ${{ github.token }}
      OOS_STI_BINDING: .local/qa-sti-p2-0c73/runtime-binding-evidence.json
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin "$OOS_STI_APPLICATION"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Dependencies only: no Office build, broad suite or GUI.
      - run: pnpm install --frozen-lockfile
      - name: Original factory STI and conversion-independent source oracle
        run: python qa/sti-p2-2026-11-23-0c73/fixture.py
      - name: OS libraries for the private headless converter only
        run: |
          sudo python3 scripts/gebruik-ubuntu-hoofdarchief.py /etc/apt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2 libcups2 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0 libice6 libnss3 libsm6 libx11-6 libxext6 libxinerama1 libxrandr2 libxrender1 libxslt1.1 libgl1 libglu1-mesa
      - name: Verify pinned shared runtime archive and all 15082 private entries
        run: python qa/sti-p2-2026-11-23-0c73/prepare_runtime.py
      - name: Production route, real STI conversion, engine edit and PPTX reopen
        run: pnpm exec vitest run --config qa/sti-p2-2026-11-23-0c73/vitest.config.ts --configLoader runner --reporter=json --outputFile=.local/qa-sti-p2-0c73/tests.json
      - name: Independent source-derived OOXML contents after conversion and saves
        if: always()
        run: |
          QA=qa/sti-p2-2026-11-23-0c73
          OUT=.local/qa-sti-p2-0c73
          status=0
          if [ -f "$OUT/converted/prs-strategy.pptx" ]; then
            python "$QA/check_pptx.py" "$OUT/converted/prs-strategy.pptx" --report "$OUT/converted-oracle-check.json" || status=1
          fi
          if [ -f "$OUT/edited.pptx" ]; then
            python "$QA/check_pptx.py" "$OUT/edited.pptx" --edited --report "$OUT/edited-oracle-check.json" || status=1
          fi
          if [ -f "$OUT/reopened.pptx" ]; then
            python "$QA/check_pptx.py" "$OUT/reopened.pptx" --edited --report "$OUT/reopened-oracle-check.json" || status=1
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-sti-p2-0c73
          path: .local/qa-sti-p2-0c73
          include-hidden-files: true
          if-no-files-found: warn
