name: Native Mac361 bounded Tab history saved XML - diagnostic only
on:
  push:
    branches: [codex/mac-native-body-blocker-20261120]
    paths: [.github/workflows/mac-native-361-tab-history.yml, .github/mac-native-361-tab-history-request.json]
permissions:
  contents: read
  actions: read
jobs:
  product-acceptance:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      OOS_361_EXECUTE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b696ab86bd1c128729a079b68c0082e6df3d36a5
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/mac-body-harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact producer/app witness, descriptor and complete Suite child
        id: suite_fetch
        run: python .local/mac-body-harness/scripts/mac-native-suite-transfer-fetch.py .local/mac-body-harness/.github/mac-native-361-tab-history-request.json .local/mac361-tab-history-input
      - name: Exactly three Tabs and planned newrow; two Undo two Redo with saved XML
        run: python .local/mac-body-harness/scripts/mac-native-current-session.py .local/mac361-tab-history-input/identity.json .local/mac361-tab-history-native --acceptance --tab-save-oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac361-tab-history-native-${{ github.sha }}
          path: |
            .local/mac361-tab-history-native/
            .local/mac361-tab-history-input/*.json
            .local/mac361-tab-history-input/*.log
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.suite_fetch.outcome == 'failure'
        with:
          name: mac361-tab-history-failed-acquisition-${{ github.sha }}
          path: .local/mac361-tab-history-input/*.zip
          include-hidden-files: true
          if-no-files-found: warn
