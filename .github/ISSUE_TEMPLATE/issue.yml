name: Report an issue
description: Report a bug, enhancement, research task, or documentation task in English.
body:
  - type: dropdown
    id: onderdeel
    attributes:
      label: Module
      multiple: true
      options:
        - Writer
        - Spreadsheet
        - Presentation
        - Notition
        - General
        - Calendar
        - Database
    validations:
      required: true
  - type: dropdown
    id: soort
    attributes:
      label: Work type
      options:
        - Bug
        - Enhancement or new feature
        - Documentation
        - Research
        - Roadmap / tracking issue
    validations:
      required: true
  - type: dropdown
    id: ui
    attributes:
      label: UI / interaction
      description: Does this concern buttons, the ribbon, dialogs, visibility, or interaction?
      options: ["Yes", "No"]
    validations:
      required: true
  - type: dropdown
    id: formaten
    attributes:
      label: File formats
      description: Does this concern opening, saving, import, export, or file preservation?
      options: ["Yes", "No"]
    validations:
      required: true
  - type: textarea
    id: beschrijving
    attributes:
      label: Description
      description: Write in English. Describe the problem or goal, expected behavior, and acceptance criteria. For bugs, include reproduction steps, environment, and observed behavior.
    validations:
      required: true
